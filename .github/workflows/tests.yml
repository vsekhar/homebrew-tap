# From Homebrew's tap-new-tests.yml template. On a pull request that changes
# a formula, test-bot builds it, runs its test, and uploads the bottle as an
# artifact for publish.yml to pick up.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      matrix:
        # A bottle pours onto the same or a newer macOS, so this serves
        # macOS 26 and later. This image's Xcode and Command Line Tools
        # match (both 26.6, Swift 6.3.3, as in decide's own CI), which
        # matters: Homebrew builds against the Command Line Tools SDK, and
        # swift-syntax's prebuilt macro support refuses an SDK older than
        # the one it was built with. The macos-15 image pairs Xcode 26.3
        # with the 16.4 tools, so it cannot build this formula. macOS 15
        # builds from source with the Xcode 26 Command Line Tools instead.
        os: [ macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9 # 2026.09.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # Bottles are hosted as assets of one GitHub Release on this repo,
      # tagged "bottles". Each file name carries the formula and version.
      - run: brew test-bot --only-formulae --root-url=https://github.com/vsekhar/homebrew-tap/releases/download/bottles
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
